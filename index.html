function sound(kind){if(!soundOn)return;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=kind==='reveal'?'triangle':'sine';o.frequency.setValueAtTime(kind==='reveal'?220:480,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(kind==='reveal'?110:660,audioCtx.currentTime+.23);g.gain.setValueAtTime(.045,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.28);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.3)}catch(e){}}

function stopTimer(){if(interval){clearInterval(interval);interval=null}}
function moduleVisual(i){

case 2:return `<div class="hashviz">${label('SHA-256 / source image')}<div class="hashline">9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08</div>${label('SHA-256 / forensic image')}<div class="hashline">9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08</div><div class="compare">${pct>95?'✓ DIGEST COMPARISON COMPLETE':'COMPARING 256-BIT DIGESTS'} ${bar(100,'green')}</div></div>`;
case 3:return `<div class="eventviewer"><div class="evhead">EVENT VIEWER / SECURITY / AUTHENTICATION</div>${log([['23:40:58 · Event 4625','Logon failed','warn'],['23:41:12 · Event 4625','Logon failed','warn'],['23:41:27 · Event 4624','Logon successful','good'],['User account','victim',''],['Correlation','POST-MORTEM SESSION','warn']])}</div>`;
case 4:return nodes(['VICTIM LAPTOP','GATEWAY','VPN / PROXY?','203.0.113.42']);
case 5:return `<div class="traffic"><div class="bars">${Array.from({length:40},(_,j)=>`<i style="height:${16+((j*37)%74)}%;animation-delay:${j*.06}s"></i>`).join('')}</div>${log([['23:39:54','TCP CONNECTION ESTABLISHED','warn'],['Source','192.168.10.15',''],['Destination','203.0.113.42',''],['Direction','OUTBOUND','warn']])}</div>`;
case 6:return `<div class="macview">${nodes(['ACCESS POINT','UNKNOWN CLIENT','LAN GATEWAY'])}<div class="macbig">02:4A:8C:31:7B:90</div><p>Local access-point client identifier / unrecognized device</p></div>`;
case 7:return `<div class="lease"><div class="leasehead">DHCP SERVER / ADDRESS LEASES</div>${log([['23:36:00','DHCP DISCOVER',''],['23:36:01','DHCP OFFER',''],['23:36:02','DHCP REQUEST',''],['23:36:03','DHCP ACK','good'],['Assigned','192.168.10.47','good']])}</div>`;
case 8:return `<div class="fileprops"><div class="fileicon">▣<small>ENC</small></div><div class="properties"><h3>confidential.enc</h3>${log([['Type','Encrypted data',''],['Created','23:32:00','warn'],['Origin','External transfer indicated','warn'],['Contents','UNAVAILABLE / ENCRYPTED','']])}</div></div>`;
case 9:return `<div class="mail"><div class="mailbar">Inbox / Security notifications</div><h3>Urgent: Verify your account</h3><p>From: Secure Bank Notifications &lt;alerts@secure-barnk.example&gt;</p><div class="mailbody">Dear customer,<br><br>Your account requires immediate verification.<br><br><span class="fakebutton">VERIFY ACCOUNT</span></div><div class="domain">${pct>60?'⚠ LOOKALIKE SENDER DOMAIN':'Inspecting sender headers…'}</div></div>`;
case 10:return `<div class="process-tree"><div class="proc">mail-client.exe</div><div class="arrow">↓</div><div class="proc">attachment opened</div><div class="arrow">↓</div><div class="proc suspicious">invoice_viewer.exe <span>⚠</span></div><div class="arrow">↓</div><div class="proc">Remote session → 203.0.113.42</div></div>`;
case 11:return `<div class="recovery"><div class="blocks">${Array.from({length:90},(_,j)=>`<i class="${j%9===0?'found':''}" style="opacity:${pct>j*1.12?1:.18}"></i>`).join('')}</div><div class="recovered">${pct>75?'Recovered fragment: user=suspect_handle':'Scanning unallocated clusters…'}</div></div>`;
case 12:return `<div class="osint">${nodes(['PROFILE A','suspect_handle','PROFILE B','SECURITY FORUM'])}<div class="osintfoot">PUBLIC USERNAME CORRELATION / THREE PLATFORM MATCHES</div></div>`;
case 13:return `<div class="alibi"><div class="alibicol"><h3>SUBJECT STATEMENT</h3><div class="claim">“I was at home.”</div></div><div class="alibicol"><h3>NETWORK TELEMETRY</h3><div class="claim danger">Device seen near victim LAN</div></div><div class="alibinote">Device proximity ≠ verified physical identity</div></div>`;
case 14:return `<div class="chronology">${[['23:32','FILE'],['23:36','DHCP'],['23:39:54','FIREWALL'],['23:41:27','LOGIN'],['LATER','CORRELATION']].map((e,j)=>`<div class="chronoevent ${pct>j*20?'active':''}"><b>${e[0]}</b><i></i><span>${e[1]}</span></div>`).join('')}</div>`;
case 15:return `<div class="deception"><div class="deception-grid">${['IP TRAIL','VPN ROUTE','PHISHING EMAIL','LOG INTEGRITY'].map((x,j)=>`<div class="decept ${pct>j*22?'suspect':''}">${x}<strong>${pct>j*22?'MISLEADING / REVIEW':'UNDER REVIEW'}</strong></div>`).join('')}</div></div>`;
case 16:return `<div class="attempts">${[['01','ACCESS DENIED'],['02','ACCESS DENIED'],['03','ACCESS GRANTED']].map((e,j)=>`<div class="attempt ${pct>(j+1)*24?'show':''}"><b>${e[0]}</b><span>${e[1]}</span></div>`).join('')}<div class="pwchange">PASSWORD CHANGED TWO HOURS BEFORE MURDER</div></div>`;

function render(){const s=scenes[idx];select.value=idx;$('moduleTitle').textContent=s.title;$('counter').textContent=`${String(idx+1).padStart(2,'0')} / 18`;
const visual=moduleVisual(idx);const isEnd=idx===17;
$('screen').innerHTML=`<div class="module-top"><span>RAHSYA / ${esc(s.title)}</span><span>${phase==='running'?'● ANALYZING':phase==='paused'?'Ⅱ PAUSED':phase==='holding'?'● SCAN COMPLETE':phase==='done'?'● VERIFIED':'○ READY'}</span></div><div class="module-visual ${isEnd?'endmode':''}">${visual}</div>${!isEnd?`<div class="workbottom"><div class="terminalbox"><div class="termhead">FORENSIC ACTIVITY LOG</div>${lines.slice(-5).map(x=>`<div class="termline">${esc(x)}</div>`).join('')||'<div class="termline">System ready / waiting for operator</div>'}</div><div class="rightresults"><div class="reshead">EVIDENCE SUMMARY</div>${s.rows.slice(0,4).map(([a,b],j)=>`<div class="resrow"><span>${esc(a)}</span><b>${revealed||j<unlocked?esc(b):'PENDING'}</b></div>`).join('')}<div class="result ${revealed?'show':''}">${revealed?esc(s.status):phase==='holding'?'SCAN COMPLETE — RESULT HELD':'ANALYSIS IN PROGRESS'}</div></div></div>`:''}<div class="bottom-progress"><span>${phase==='running'?'PROCESSING':phase==='holding'?'READY FOR RESULT':phase==='done'?'EVIDENCE DISPLAYED':'STANDBY'}</span><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><b>${Math.round(pct)}%</b></div>`;
$('black').textContent=black?'Restore (B)':'Blackout (B)';$('reveal').textContent=phase==='paused'?'▶ Resume (Space)':phase==='running'?'Ⅱ Pause (Space)':'▶ Start Process (Space)';$('pause').textContent=phase==='paused'?'▶ Resume':'Ⅱ Pause';document.body.classList.toggle('running',phase==='running')}
function setScene(i){stopTimer();idx=Math.max(0,Math.min(scenes.length-1,i));revealed=false;black=false;phase='ready';pct=0;lines=[];unlocked=0;document.body.classList.remove('blackout');render();sound('change')}
function tick(){pct=Math.min(100,pct+1.2+Math.random()*2.2);lines.push(makeLine());if(lines.length>8)lines.shift();unlocked=Math.min(scenes[idx].rows.length,Math.floor((pct/100)*scenes[idx].rows.length));if(pct>=100){pct=100;phase='holding';stopTimer();lines.push('[OK] Analysis finished. Awaiting investigator confirmation.');sound('change');render();return}render()}
function run(){if(scenes[idx].type==='ending'){phase='done';revealed=true;render();sound('reveal');return}if(phase==='running'){phase='paused';stopTimer();render();return}if(phase==='paused'){phase='running';interval=setInterval(tick,170);render();return}if(phase==='holding'||phase==='done')return;phase='running';lines=['[INIT] FORENSIC ANALYSIS ENGINE READY','[CASE] RAH-001 / OFFLINE SIMULATION','[SAFE] DEMONSTRATION DATA ONLY'];interval=setInterval(tick,170);render();sound('change')}
function finish(){stopTimer();pct=100;unlocked=scenes[idx].rows.length;phase='done';revealed=true;lines.push('[VERIFIED] Evidence result released to investigator');if(lines.length>9)lines.shift();render();sound('reveal')}
function pause(){if(phase==='running'||phase==='paused')run()}
function blackout(){black=!black;document.body.classList.toggle('blackout',black);$('black').textContent=black?'Restore (B)':'Blackout (B)'}
$('prev').onclick=()=>setScene(idx-1);$('next').onclick=()=>setScene(idx+1);$('reveal').onclick=run;$('finish').onclick=finish;$('pause').onclick=pause;$('black').onclick=blackout;$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent='Sound: '+(soundOn?'ON':'OFF')};select.onchange=e=>setScene(+e.target.value);$('full').onclick=()=>{if(!document.fullscreenElement)$('stage').requestFullscreen?.();else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;const k=e.key.toLowerCase();if(k===' '){e.preventDefault();run()}else if(k==='enter'){e.preventDefault();finish()}else if(k==='n'||k==='arrowright')setScene(idx+1);else if(k==='p'||k==='arrowleft')setScene(idx-1);else if(k==='b')blackout();else if(k==='r')setScene(idx);else if(k==='f')$('full').click()});render();
